<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>طهّر قلبك</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#0e1a16;--bg2:#162a23;--gold:#e0bd74;--ink:#f1ead8;--mute:#8fa59b;--line:#2c4a3f;--char:#1a1a1a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:radial-gradient(120% 70% at 50% 30%,var(--bg2),var(--bg));color:var(--ink);font-family:Tajawal,system-ui,sans-serif;-webkit-tap-highlight-color:transparent;user-select:none}
main{max-width:460px;margin:0 auto;padding:18px 20px 28px;display:flex;flex-direction:column;align-items:center;gap:10px}
h1{font-family:Amiri,serif;font-weight:700;font-size:2.4rem;margin:4px 0 0;color:var(--gold)}
.sub{margin:0;color:var(--mute);font-size:.95rem}
#stage{width:min(78vw,320px);aspect-ratio:200/190;cursor:pointer;touch-action:manipulation;position:relative}
#stage svg{width:100%;height:100%;overflow:visible;display:block}
#stage:focus-visible{outline:2px solid var(--gold);outline-offset:8px;border-radius:24px}
.chunk{transition:transform .9s cubic-bezier(.5,0,.9,.6),opacity .9s;transform-box:fill-box;transform-origin:center}
.chunk.off{opacity:0;pointer-events:none}
#glow{transition:opacity 1.2s;opacity:0}
.done #glow{opacity:1}
#zikr{font-family:Amiri,serif;font-size:2.2rem;margin:6px 0 0;line-height:1.2}
#cnt{font-size:1.3rem;color:var(--gold);font-variant-numeric:tabular-nums;margin:0}
#msg{min-height:1.4em;margin:0;color:var(--gold);font-size:1rem}
.bar{width:100%;height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--gold);transition:width .25s}
.row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;width:100%}
button{font:inherit;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:999px;padding:8px 16px;cursor:pointer;min-height:40px}
button[aria-pressed=true]{background:var(--gold);color:#1a1405;border-color:var(--gold);font-weight:700}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.lbl{width:100%;text-align:center;color:var(--mute);font-size:.85rem;margin-top:8px}
.stats{display:flex;gap:28px;margin-top:10px;color:var(--mute);font-size:.9rem}
.stats b{color:var(--ink);font-size:1.15rem;display:block;text-align:center}
.link{border:0;color:var(--mute);text-decoration:underline;min-height:32px;padding:4px 8px}
@media (prefers-reduced-motion:reduce){.chunk,#glow,.bar i{transition:none}}
</style>
</head>
<body>
<main>
  <h1>طهّر قلبك</h1>
  <p class="sub">اضغط على القلب مع كل ذكر</p>

  <div id="stage" role="button" tabindex="0" aria-label="اضغط للتسبيح">
    <svg viewBox="0 0 200 190" aria-hidden="true">
      <defs>
        <linearGradient id="fl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e4523a"/><stop offset="1" stop-color="#8f1d1d"/></linearGradient>
        <radialGradient id="gl"><stop offset="0" stop-color="#ff8a5c" stop-opacity=".55"/><stop offset="1" stop-color="#ff8a5c" stop-opacity="0"/></radialGradient>
        <clipPath id="hc"><path id="hp" d="M100 175C20 120 5 70 35 38C60 12 90 22 100 48C110 22 140 12 165 38C195 70 180 120 100 175Z"/></clipPath>
      </defs>
      <ellipse id="glow" cx="100" cy="100" rx="130" ry="120" fill="url(#gl)"/>
      <ellipse cx="100" cy="184" rx="52" ry="5" fill="#000" opacity=".35"/>
      <path d="M100 175C20 120 5 70 35 38C60 12 90 22 100 48C110 22 140 12 165 38C195 70 180 120 100 175Z" fill="url(#fl)"/>
      <g fill="none" stroke="#ffb08f" stroke-opacity=".45" stroke-width="1.6" stroke-linecap="round">
        <path d="M100 52C96 85 92 120 100 168"/><path d="M62 52C60 90 75 130 98 160"/><path d="M140 52C142 90 128 130 102 160"/><path d="M40 70C46 100 70 135 96 165"/><path d="M160 70C154 100 130 135 104 165"/>
      </g>
      <g stroke="#b9c6d6" stroke-width="0">
        <path d="M82 44C70 20 74 12 84 12C92 14 94 30 96 46Z" fill="#7d86a8"/>
        <path d="M104 46C102 22 112 8 124 14C132 22 122 38 112 48Z" fill="#c83a2c"/>
      </g>
      <g clip-path="url(#hc)" id="chunks"></g>
    </svg>
  </div>

  <p id="zikr">أستغفر الله</p>
  <p id="cnt">٠ / ١٠٠</p>
  <div class="bar" aria-hidden="true"><i id="fill"></i></div>
  <p id="msg" aria-live="polite"></p>

  <div class="lbl">الذكر</div>
  <div class="row" id="zk"></div>
  <div class="lbl">العدد</div>
  <div class="row" id="tg"></div>

  <div class="stats">
    <div><b id="today">٠</b>اليوم</div>
    <div><b id="streak">٠</b>أيام متتالية</div>
  </div>
  <button class="link" id="reset">ابدأ من جديد</button>
</main>

<script>
(function(){
  var ZK=['أستغفر الله','سبحان الله','الحمد لله','لا إله إلا الله','اللهم صلِّ على محمد'];
  var TG=[33,100,300];
  var st={zk:0,tg:100,n:0};
  var chunks=[], off=0;
  var ns='http://www.w3.org/2000/svg';
  var $=function(i){return document.getElementById(i)};
  var ar=function(x){return Number(x).toLocaleString('ar-EG')};

  // storage (per-viewer convenience only)
  var store={
    get:function(){try{return JSON.parse(localStorage.getItem('tq')||'{}')}catch(e){return {}}},
    set:function(o){try{localStorage.setItem('tq',JSON.stringify(o))}catch(e){}}
  };
  var day=function(d){return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()};
  var data=store.get();
  var todayKey=day(new Date());
  if(data.day!==todayKey){
    var y=new Date();y.setDate(y.getDate()-1);
    data.streak=(data.day===day(y)&&data.today>0)?data.streak||0:(data.streak&&data.day===day(y)?data.streak:0);
    data.today=0;data.day=todayKey;
  }
  var counted=false;

  function buildChunks(){
    var g=$('chunks');g.innerHTML='';chunks=[];off=0;
    var p=$('hp'),svg=g.ownerSVGElement;
    var seed=7;function rnd(){seed=(seed*16807)%2147483647;return seed/2147483647}
    var list=[];
    for(var r=0;r<11;r++){for(var c=0;c<11;c++){
      var cx=6+c*17.2+(rnd()-.5)*7, cy=12+r*15.2+(rnd()-.5)*6;
      var pt=svg.createSVGPoint();pt.x=cx;pt.y=cy;
      if(!p.isPointInFill(pt))continue;
      list.push({x:cx,y:cy});
    }}
    list.sort(function(a,b){return a.y-b.y+(rnd()-.5)*10});
    list.forEach(function(q){
      var n=7,pts=[];
      for(var k=0;k<n;k++){var a=k/n*6.283+rnd()*.4,rr=11+rnd()*7;pts.push((q.x+Math.cos(a)*rr).toFixed(1)+','+(q.y+Math.sin(a)*rr*.9).toFixed(1))}
      var e=document.createElementNS(ns,'polygon');
      e.setAttribute('points',pts.join(' '));
      var s=20+Math.floor(rnd()*14);
      e.setAttribute('fill','rgb('+s+','+s+','+s+')');
      e.setAttribute('stroke','#000');e.setAttribute('stroke-opacity','.5');e.setAttribute('stroke-width','.8');
      e.setAttribute('class','chunk');
      e.dataset.dx=((rnd()-.5)*50).toFixed(0);e.dataset.rot=((rnd()-.5)*160).toFixed(0);
      g.appendChild(e);chunks.push(e);
    });
  }

  function render(){
    var frac=Math.min(1,st.n/st.tg);
    var want=Math.round(frac*chunks.length);
    while(off<want){
      var e=chunks[off++];
      e.style.transform='translate('+e.dataset.dx+'px,230px) rotate('+e.dataset.rot+'deg)';
      e.classList.add('off');
    }
    while(off>want){
      var e2=chunks[--off];
      e2.style.transition='none';e2.style.transform='';e2.classList.remove('off');
      void e2.getBoundingClientRect();e2.style.transition='';
    }
    $('cnt').textContent=ar(st.n)+' / '+ar(st.tg);
    $('fill').style.width=(frac*100)+'%';
    var done=st.n>=st.tg;
    $('stage').classList.toggle('done',done);
    document.body.classList.toggle('done',done);
    $('msg').textContent=done?'تمّ الذكر. نسأل الله أن يطهّر قلوبنا.':'';
    $('today').textContent=ar(data.today||0);
    $('streak').textContent=ar(data.streak||0);
  }

  function tap(){
    if(st.n>=st.tg){return}
    st.n++;
    data.today=(data.today||0)+1;
    if(!counted){data.streak=(data.streak||0)+1;counted=true}
    data.day=todayKey;store.set(data);
    try{if(navigator.vibrate)navigator.vibrate(st.n>=st.tg?[40,60,40]:12)}catch(e){}
    render();
  }

  function reset(){st.n=0;render()}

  function chips(id,items,cur,fn,label){
    var box=$(id);box.innerHTML='';
    items.forEach(function(it,i){
      var b=document.createElement('button');
      b.textContent=label(it);
      b.setAttribute('aria-pressed',String(i===cur));
      b.onclick=function(){fn(i);chips(id,items,i,fn,label)};
      box.appendChild(b);
    });
  }

  $('stage').addEventListener('click',tap);
  $('stage').addEventListener('keydown',function(e){if(e.key===' '||e.key==='Enter'){e.preventDefault();tap()}});
  $('reset').onclick=reset;

  chips('zk',ZK,0,function(i){st.zk=i;$('zikr').textContent=ZK[i];reset()},function(t){return t});
  chips('tg',TG,1,function(i){st.tg=TG[i];reset()},function(n){return ar(n)});

  buildChunks();
  if(data.today&&data.day===todayKey)counted=true;
  render();
})();
</script>
</body>
</html>
